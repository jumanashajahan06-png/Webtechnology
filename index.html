<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasty Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Dark mode toggle -->
<div class="toggle-container">
    <input type="checkbox" id="dark-toggle">
    <label for="dark-toggle">🌙 Dark Mode</label>
</div>

<div class="page">

<h1>🍽️ Tasty Restaurant</h1>

<ul class="features">
    <li>Fresh</li>
    <li>Delicious</li>
    <li>Affordable</li>
</ul>

<div class="menu">

    <h2>Starters</h2>
    <label class="item">
        <input type="checkbox">
        <span class="name">Veg Soup</span>
        <span class="price">$80</span>
    </label>

    <label class="item">
        <input type="checkbox">
        <span class="name">Paneer Tikka</span>
        <span class="price">$150</span>
    </label>

    <h2>Main Course</h2>
    <label class="item">
        <input type="checkbox">
        <span class="name">Chicken Biryani</span>
        <span class="price">$200</span>
    </label>

    <label class="item">
        <input type="checkbox">
        <span class="name">Naan</span>
        <span class="price">$40</span>
    </label>

    <h2>Desserts</h2>
    <label class="item">
        <input type="checkbox">
        <span class="name">Gulab Jamun</span>
        <span class="price">$80</span>
    </label>

    <label class="item">
        <input type="checkbox">
        <span class="name">Ice Cream</span>
        <span class="price">$70</span>
    </label>

</div>

<footer>✨ Click items to select your favorites ✨</footer>

</div>
</body>
</html>
